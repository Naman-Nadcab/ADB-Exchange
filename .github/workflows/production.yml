name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_image_tag:
        description: 'Rollback — image tag to deploy (e.g. sha-abc1234 or latest)'
        required: false
        type: string
      skip_deploy:
        description: 'Build and push only (no VPS deploy)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/exchange

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build backend
        run: npm run build --workspace=@exchange/backend
      - name: Build frontend
        run: npm run build --workspace=@exchange/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_WS_URL: wss://api.example.com
      - name: Build admin panel
        run: npm run build --workspace=@exchange/admin-panel
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate production compose
        run: |
          set -euo pipefail
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=ci_postgres_secret_min_16
          RABBITMQ_PASSWORD=ci_rabbit_secret_min_16
          JWT_SECRET=ci_jwt_secret_must_be_32_chars_min
          JWT_REFRESH_SECRET=ci_refresh_secret_32_chars_min
          ENCRYPTION_KEY=ci_encryption_key_32_chars_min
          ENGINE_HMAC_SECRET=ci_engine_hmac_secret_value
          EOF
          export $(grep -v '^#' .env.ci | xargs)
          docker compose -f docker-compose.production.yml config --quiet
      - name: Smoke API script (syntax)
        run: node --check scripts/smoke-api.mjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: apps/backend
          - service: frontend
            context: apps/frontend
          - service: admin-panel
            context: apps/admin-panel
          - service: indexer
            context: apps/indexer
          - service: matching-engine
            context: matching-engine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event.inputs.skip_deploy != 'true'
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/exchange' }}
            export IMAGE_TAG="${{ github.event.inputs.rollback_image_tag || github.sha }}"
            docker compose -f docker-compose.production.yml pull || true
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            sleep 15
            curl -sf http://127.0.0.1/health/live || curl -sf http://127.0.0.1:4000/health/live
      - name: Post-deploy health
        run: |
          if [ -n "${{ secrets.PUBLIC_HEALTH_URL }}" ]; then
            curl -sf "${{ secrets.PUBLIC_HEALTH_URL }}/health/live"
          else
            echo "PUBLIC_HEALTH_URL not set — skipped external health check"
          fi

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_image_tag != ''
    environment: production
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH || '/opt/exchange' }}
            export IMAGE_TAG="${{ github.event.inputs.rollback_image_tag }}"
            docker compose -f docker-compose.production.yml up -d --no-build
            curl -sf http://127.0.0.1/health/live
