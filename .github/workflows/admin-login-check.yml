name: Check admin login

# One signed-in check of the production admin API. Does not change containers.
on:
  push:
    tags:
      - 'admin-login-check/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify the ED25519 host key before connecting
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          expected='SHA256:LPQv0Wf2i7YpOkuz+UBDw0U244tU/NumiDo4v7zuHGc'
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          dir="${RUNNER_TEMP}/adb-admin-ssh"
          rm -rf "$dir"
          mkdir -p "$dir"
          chmod 700 "$dir"
          scan=$(mktemp)
          ssh-keyscan -T 15 -t ed25519 -- "$VPS_HOST" 2>/dev/null | grep 'ssh-ed25519 ' >"$scan"
          test "$(grep -c 'ssh-ed25519 ' "$scan")" -eq 1
          fp=$(ssh-keygen -lf "$scan" | awk 'NR==1 { print $2 }')
          echo "HOST_KEY_FINGERPRINT=$fp"
          test "$fp" = "$expected"
          cp "$scan" "$dir/known_hosts"
          chmod 644 "$dir/known_hosts"
          rm -f "$scan"

      - name: Install the temporary deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          dir="${RUNNER_TEMP}/adb-admin-ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$dir/id"
          chmod 600 "$dir/id"
          ssh-keygen -lf "$dir/id" >/dev/null

      - name: Sign in once and read the admin summary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          NGINX_APP: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -eu
          dir="${RUNNER_TEMP}/adb-admin-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          app="${NGINX_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "APP=$(printf '%q' "$app") sh -s" \
            < deployment/admin-login-check-remote.sh

      - name: Remove temporary SSH key material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/adb-admin-ssh"
