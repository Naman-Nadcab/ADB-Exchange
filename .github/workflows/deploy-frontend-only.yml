name: Deploy frontend only

# Rebuilds only the customer frontend container on the production VPS.
# It does not run the full-stack production workflow, migrations, or other services.
# SSH uses native OpenSSH and accepts only the verified ED25519 host key.
#
# Cursor starts a deploy by pushing one lightweight tag. The tag must point at
# the frontend release commit. Its name is:
#   frontend-deploy/<release-sha>/<expected-production-sha>
# Both values are 40 lowercase hex characters. The create event is required
# because the release commit does not contain this workflow file; GitHub reads
# this file from the default branch and the job checks that file out explicitly.
# Push filters are not used, so ordinary branch pushes and other tags do nothing.
on:
  create:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Frontend release commit. Required for DEPLOY_FRONTEND_ONLY.'
        required: false
        default: ''
        type: string
      expected_production_sha:
        description: 'Production HEAD that must already be checked out. Required for DEPLOY_FRONTEND_ONLY.'
        required: false
        default: ''
        type: string
      confirmation:
        description: 'INSPECT_ONLY, DEPLOY_FRONTEND_ONLY, or ROLLBACK_FRONTEND_ONLY'
        required: true
        default: INSPECT_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-only-production
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/frontend-deploy/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      confirmation: ${{ steps.decision.outputs.confirmation }}
      release_sha: ${{ steps.decision.outputs.release_sha }}
      expected_sha: ${{ steps.decision.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve the frontend-only operation
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          INPUT_RELEASE: ${{ github.event.inputs.release_sha }}
          INPUT_EXPECTED: ${{ github.event.inputs.expected_production_sha }}
        run: sh deployment/frontend-only-resolve.sh

  remote:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate the production-tree rule
        run: sh deployment/frontend-only-tree-status.test.sh

      - name: Require a frontend-only fast-forward and bundle it
        if: needs.resolve.outputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          FE_EXPECTED: ${{ needs.resolve.outputs.expected_sha }}
          FE_RELEASE: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -eu
          expected="$FE_EXPECTED"
          release="$FE_RELEASE"
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$release" | grep -Eq '^[0-9a-f]{40}$'
          chmod +x deployment/frontend-only-preflight.sh deployment/frontend-only-tag.sh
          if [ "$EVENT_NAME" = "create" ]; then
            sh deployment/frontend-only-tag.sh parse "$EVENT_REF" >/dev/null
            if ! git rev-parse --verify --quiet "${EVENT_REF}^{commit}" >/dev/null; then
              git fetch origin "$EVENT_REF:$EVENT_REF"
            fi
            sh deployment/frontend-only-tag.sh verify "$EVENT_REF"
            parsed=$(sh deployment/frontend-only-tag.sh parse "$EVENT_REF")
            test "$(printf '%s\n' "$parsed" | awk -F= '/^RELEASE=/ { print $2; exit }')" = "$release"
            test "$(printf '%s\n' "$parsed" | awk -F= '/^EXPECTED=/ { print $2; exit }')" = "$expected"
          fi
          git cat-file -e "${expected}^{commit}" 2>/dev/null || git fetch --no-tags origin "$expected"
          git cat-file -e "${release}^{commit}" 2>/dev/null || git fetch --no-tags origin "$release"
          ./deployment/frontend-only-preflight.sh "$expected" "$release"
          expected=$(git rev-parse "${expected}^{commit}")
          release=$(git rev-parse "${release}^{commit}")
          git update-ref refs/frontend-only/release "$release"
          git bundle create frontend-only.bundle refs/frontend-only/release ^"$expected"
          git bundle verify frontend-only.bundle >/dev/null
          tip=$(git bundle list-heads frontend-only.bundle | awk 'NR==1 { print $1 }')
          test "$tip" = "$release"
          echo "bundle_tip=$tip"

      - name: Verify the ED25519 host key before connecting
        # Pin: SHA256:LPQv0Wf2i7YpOkuz+UBDw0U244tU/NumiDo4v7zuHGc
        # Enforced by deployment/frontend-only-hostkey.sh before any connection.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          echo "WORKFLOW_REF=${{ github.ref }}"
          echo "WORKFLOW_SHA=${{ github.sha }}"
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          rm -rf "$dir"
          mkdir -p "$dir"
          chmod 700 "$dir"
          chmod +x deployment/frontend-only-hostkey.sh
          ./deployment/frontend-only-hostkey.sh "$VPS_HOST" "$dir/known_hosts"

      - name: Install the temporary deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$dir/id"
          chmod 600 "$dir/id"
          if ! ssh-keygen -lf "$dir/id" >/dev/null; then
            echo "DEPLOY_KEY_UNREADABLE" >&2
            exit 1
          fi

      - name: Read production state
        if: needs.resolve.outputs.confirmation == 'INSPECT_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "WORKFLOW_REF=${{ github.ref }}"
          echo "WORKFLOW_SHA=${{ github.sha }}"
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "APP=$(printf '%q' "$app") sh -s" <<FE_REMOTE
          set -eu
          cd "\$APP"
          if [ ! -f docker-compose.production.yml ] || [ ! -d apps/frontend ] || [ ! -d .git ]; then
            echo "APP_PATH_INVALID" >&2
            exit 1
          fi
          echo "PRODUCTION_HOSTNAME=\$(hostname)"
          echo "PRODUCTION_HEAD=\$(git rev-parse HEAD)"
          FRONTEND_ONLY_TREE_LIBRARY=1
          $(cat deployment/frontend-only-tree-status.sh)
          classify_production_tree
          for name in exchange-frontend exchange-backend exchange-postgres exchange-redis exchange-nats exchange-matching-engine exchange-admin exchange-nginx exchange-indexer exchange-rabbitmq; do
            if docker inspect "\$name" >/dev/null 2>&1; then
              docker inspect -f "\$name status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}} image={{.Image}}" "\$name"
            else
              echo "\$name MISSING"
            fi
          done
          echo "INSPECT_ONLY"
          FE_REMOTE

      - name: Roll back only the frontend container
        if: needs.resolve.outputs.confirmation == 'ROLLBACK_FRONTEND_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "FE_MODE=rollback FE_APP=$(printf '%q' "$app") sh -s" <<FE_REMOTE
          FRONTEND_ONLY_TREE_LIBRARY=1
          $(cat deployment/frontend-only-tree-status.sh)
          $(cat deployment/frontend-only-remote.sh)
          FE_REMOTE

      - name: Copy the frontend bundle
        if: needs.resolve.outputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          test -f frontend-only.bundle
          scp \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            frontend-only.bundle \
            "$VPS_USER@$VPS_HOST:/tmp/frontend-only.bundle"

      - name: Rebuild only the frontend container
        if: needs.resolve.outputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        timeout-minutes: 40
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
          FE_EXPECTED: ${{ needs.resolve.outputs.expected_sha }}
          FE_RELEASE: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          printf '%s' "$FE_EXPECTED" | grep -Eq '^[0-9a-f]{40}$' || { echo "expected_production_sha is not a commit SHA" >&2; exit 1; }
          printf '%s' "$FE_RELEASE" | grep -Eq '^[0-9a-f]{40}$' || { echo "release_sha is not a commit SHA" >&2; exit 1; }
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "FE_MODE=deploy FE_APP=$(printf '%q' "$app") FE_EXPECTED=$(printf '%q' "$FE_EXPECTED") FE_RELEASE=$(printf '%q' "$FE_RELEASE") sh -s" <<FE_REMOTE
          FRONTEND_ONLY_TREE_LIBRARY=1
          $(cat deployment/frontend-only-tree-status.sh)
          $(cat deployment/frontend-only-remote.sh)
          FE_REMOTE

      - name: Public smoke checks
        if: needs.resolve.outputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        run: |
          set -eu
          curl -fsSI --max-time 20 https://169.58.39.2/login >/dev/null
          curl -fsSI --max-time 20 https://169.58.39.2/forex/account >/dev/null
          curl -fsS --max-time 20 https://169.58.39.2/health | grep -q '"status":"healthy"'
          echo "public_smoke=ok"

      - name: Remove temporary SSH key material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/adb-frontend-ssh"
