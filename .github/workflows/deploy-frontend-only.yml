name: Deploy frontend only

# Rebuilds only the customer frontend container on the production VPS.
# It does not run the full-stack production workflow, migrations, or other services.
# SSH uses native OpenSSH and accepts only the verified ED25519 host key.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Frontend release commit. Required for DEPLOY_FRONTEND_ONLY.'
        required: false
        default: ''
        type: string
      expected_production_sha:
        description: 'Production HEAD that must already be checked out. Required for DEPLOY_FRONTEND_ONLY.'
        required: false
        default: ''
        type: string
      confirmation:
        description: 'INSPECT_ONLY, DEPLOY_FRONTEND_ONLY, or ROLLBACK_FRONTEND_ONLY'
        required: true
        default: INSPECT_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-only-production
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only an explicit operation
        run: |
          set -eu
          case "${{ inputs.confirmation }}" in
            INSPECT_ONLY|DEPLOY_FRONTEND_ONLY|ROLLBACK_FRONTEND_ONLY) ;;
            *)
              echo "Rejected confirmation. Use INSPECT_ONLY, DEPLOY_FRONTEND_ONLY, or ROLLBACK_FRONTEND_ONLY." >&2
              exit 1
              ;;
          esac
          echo "confirmation=${{ inputs.confirmation }}"

  remote:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a frontend-only fast-forward and bundle it
        if: inputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        run: |
          set -eu
          expected='${{ inputs.expected_production_sha }}'
          release='${{ inputs.release_sha }}'
          case "$expected" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "expected_production_sha is not a commit SHA" >&2; exit 1 ;;
          esac
          case "$release" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "release_sha is not a commit SHA" >&2; exit 1 ;;
          esac
          chmod +x deployment/frontend-only-preflight.sh
          ./deployment/frontend-only-preflight.sh "$expected" "$release"
          expected=$(git rev-parse "${expected}^{commit}")
          release=$(git rev-parse "${release}^{commit}")
          git update-ref refs/frontend-only/release "$release"
          git bundle create frontend-only.bundle refs/frontend-only/release ^"$expected"
          git bundle verify frontend-only.bundle >/dev/null
          tip=$(git bundle list-heads frontend-only.bundle | awk 'NR==1 { print $1 }')
          test "$tip" = "$release"
          echo "bundle_tip=$tip"

      - name: Verify the ED25519 host key before connecting
        # Pin: SHA256:LPQv0Wf2i7YpOkuz+UBDw0U244tU/NumiDo4v7zuHGc
        # Enforced by deployment/frontend-only-hostkey.sh before any connection.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          echo "WORKFLOW_REF=${{ github.ref }}"
          echo "WORKFLOW_SHA=${{ github.sha }}"
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          rm -rf "$dir"
          mkdir -p "$dir"
          chmod 700 "$dir"
          chmod +x deployment/frontend-only-hostkey.sh
          ./deployment/frontend-only-hostkey.sh "$VPS_HOST" "$dir/known_hosts"

      - name: Install the temporary deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$dir/id"
          chmod 600 "$dir/id"
          if ! ssh-keygen -lf "$dir/id" >/dev/null; then
            echo "DEPLOY_KEY_UNREADABLE" >&2
            exit 1
          fi

      - name: Read production state
        if: inputs.confirmation == 'INSPECT_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "WORKFLOW_REF=${{ github.ref }}"
          echo "WORKFLOW_SHA=${{ github.sha }}"
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "APP=$(printf '%q' "$app") sh -s" <<'EOF'
          set -eu
          cd "$APP"
          if [ ! -f docker-compose.production.yml ] || [ ! -d apps/frontend ] || [ ! -d .git ]; then
            echo "APP_PATH_INVALID" >&2
            exit 1
          fi
          echo "PRODUCTION_HOSTNAME=$(hostname)"
          echo "PRODUCTION_HEAD=$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            echo "PRODUCTION_TREE_STATUS=dirty"
            exit 1
          fi
          echo "PRODUCTION_TREE_STATUS=clean"
          for name in exchange-frontend exchange-backend exchange-postgres exchange-redis exchange-nats exchange-matching-engine exchange-admin exchange-nginx exchange-indexer exchange-rabbitmq; do
            if docker inspect "$name" >/dev/null 2>&1; then
              docker inspect -f "$name status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}} image={{.Image}}" "$name"
            else
              echo "$name MISSING"
            fi
          done
          echo "INSPECT_ONLY"
          EOF

      - name: Roll back only the frontend container
        if: inputs.confirmation == 'ROLLBACK_FRONTEND_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "FE_MODE=rollback FE_APP=$(printf '%q' "$app") sh -s" < deployment/frontend-only-remote.sh

      - name: Copy the frontend bundle
        if: inputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          test -f frontend-only.bundle
          scp \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            frontend-only.bundle \
            "$VPS_USER@$VPS_HOST:/tmp/frontend-only.bundle"

      - name: Rebuild only the frontend container
        if: inputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        timeout-minutes: 40
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FE_APP: ${{ secrets.VPS_DEPLOY_PATH }}
          FE_EXPECTED: ${{ inputs.expected_production_sha }}
          FE_RELEASE: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/adb-frontend-ssh"
          case "$VPS_HOST" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_HOST_UNSAFE" >&2; exit 1 ;;
          esac
          case "$VPS_USER" in
            ''|*[!A-Za-z0-9._-]*) echo "VPS_USER_UNSAFE" >&2; exit 1 ;;
          esac
          case "$FE_EXPECTED" in
            ''|*[!0-9a-fA-F]*) echo "expected_production_sha is not a commit SHA" >&2; exit 1 ;;
          esac
          case "$FE_RELEASE" in
            ''|*[!0-9a-fA-F]*) echo "release_sha is not a commit SHA" >&2; exit 1 ;;
          esac
          app="${FE_APP:-/opt/adb-exchange}"
          case "$app" in
            ''|*[!A-Za-z0-9/_.-]*) echo "APP_PATH_UNSAFE" >&2; exit 1 ;;
          esac
          ssh \
            -i "$dir/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "FE_MODE=deploy FE_APP=$(printf '%q' "$app") FE_EXPECTED=$(printf '%q' "$FE_EXPECTED") FE_RELEASE=$(printf '%q' "$FE_RELEASE") sh -s" < deployment/frontend-only-remote.sh

      - name: Public smoke checks
        if: inputs.confirmation == 'DEPLOY_FRONTEND_ONLY'
        run: |
          set -eu
          curl -fsSI --max-time 20 https://169.58.39.2/login >/dev/null
          curl -fsSI --max-time 20 https://169.58.39.2/forex/account >/dev/null
          curl -fsS --max-time 20 https://169.58.39.2/health | grep -q '"status":"healthy"'
          echo "public_smoke=ok"

      - name: Remove temporary SSH key material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/adb-frontend-ssh"
