# Production stack: infra + matching engine + API workers + frontends + TLS proxy
#
# First boot (VPS IP, no domain yet):
#   cp .env.production.example .env   # fill secrets + VPS_PUBLIC_URL
#   bash scripts/generate-self-signed-tls.sh   # optional; or HTTP-only until certs exist
#   bash scripts/vps-first-boot.sh
#
# TLS: place fullchain.pem + privkey.pem in nginx/ssl/ OR run generate-self-signed-tls.sh
# Without certs nginx starts in HTTP-only mode on port 80.

x-app-env: &app-env
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exchange} -d ${POSTGRES_DB:-exchange}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exchange-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    build:
      context: ./infra/nats
      dockerfile: Dockerfile
    image: exchange-nats:2.10-alpine
    container_name: exchange-nats
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: exchange-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exchange}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  indexer:
    <<: *app-env
    build:
      context: ./apps/indexer
      dockerfile: Dockerfile
    container_name: exchange-indexer
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exchange}
      INDEXER_API_PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1:4001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  matching-engine:
    <<: *app-env
    build:
      context: ./matching-engine
      dockerfile: Dockerfile
    container_name: exchange-matching-engine
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      USE_EVENT_STREAM: ${USE_EVENT_STREAM:-true}
      ENGINE_TIER1_WAL_REQUIRED: ${ENGINE_TIER1_WAL_REQUIRED:-true}
      ENGINE_MATCH_WAL_PATH: /data/wal/match_events.jsonl
      ENGINE_HTTP_PORT: "7101"
      ENGINE_HTTP_BIND: "0.0.0.0"
      ENGINE_HMAC_SECRET: ${ENGINE_HMAC_SECRET:?ENGINE_HMAC_SECRET required}
      ENGINE_HMAC_SECRET_ACTIVE: ${ENGINE_HMAC_SECRET_ACTIVE:-${ENGINE_HMAC_SECRET}}
      MATCH_EVENTS_PARTITIONS: ${MATCH_EVENTS_PARTITION_COUNT:-1}
    volumes:
      - engine_wal:/data/wal
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7101/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  backend:
    <<: *app-env
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: exchange-backend
    environment:
      NODE_ENV: production
      RUN_MODE: all
      PORT: "4000"
      TIER1_LAUNCH: ${TIER1_LAUNCH:-true}
      STRICT_DEPENDENCY_STARTUP: ${STRICT_DEPENDENCY_STARTUP:-true}
      HEALTH_REQUIRE_MATCHING_ENGINE: ${HEALTH_REQUIRE_MATCHING_ENGINE:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-exchange}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MATCHING_ENGINE_URL: http://matching-engine:7101
      USE_RUST_MATCHING_ENGINE: "true"
      USE_EVENT_STREAM: ${USE_EVENT_STREAM:-true}
      KMS_TYPE: ${KMS_TYPE:-aws}
      KMS_STARTUP_PROBE: ${KMS_STARTUP_PROBE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
    ports:
      # Localhost-only: Prometheus/metrics scrape and emergency curl without exposing via nginx
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    <<: *app-env
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
        NEXT_PUBLIC_ADMIN_PANEL_URL: ${PUBLIC_ADMIN_URL:-}
    container_name: exchange-frontend
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  admin-panel:
    <<: *app-env
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        ADMIN_BASE_PATH: /admin
        NEXT_PUBLIC_ADMIN_2FA_REQUIRED: ${ADMIN_2FA_MANDATORY:-false}
    container_name: exchange-admin
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: exchange-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./nginx/nginx.tls.conf:/etc/nginx/nginx.tls.conf:ro
      - ./nginx/nginx.http-only.conf:/etc/nginx/nginx.http-only.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    entrypoint: ["/docker-entrypoint.sh"]
    depends_on:
      frontend:
        condition: service_started
      admin-panel:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-shot DB migration (production image — compiled migrate.js)
  migrate:
    profiles: [tools]
    <<: *app-env
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: exchange-migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot admin seed (devtools image with tsx)
  seed-admin:
    profiles: [tools]
    <<: *app-env
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.devtools
    container_name: exchange-seed-admin
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required for admin 2FA bootstrap}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  engine_wal:

networks:
  default:
    name: exchange-production
    driver: bridge
