appId: com.metheorium.mobile
---
# Expo dev-client: launchApp opens the dev launcher, not the JS bundle.
# Requires Metro on http://127.0.0.1:8081 (npx expo start --dev-client).
# Run flows sequentially with a pause between suites to avoid Fabric teardown crashes.
- launchApp:
    clearState: true
    stopApp: true
- openLink: exp+metheorium-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- extendedWaitUntil:
    visible:
      id: "S-100"
    timeout: 180000
