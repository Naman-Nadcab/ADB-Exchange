worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Re-resolve Docker service names when upstream containers are recreated (avoids 502 stale IP).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HTTP-only mode for first boot (VPS IP, no TLS yet)
  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location = /api {
      set $upstream_host frontend;
      proxy_pass http://$upstream_host:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      set $upstream_host backend;
      proxy_pass http://$upstream_host:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /health {
      set $upstream_host backend;
      proxy_pass http://$upstream_host:4000/health;
      proxy_set_header Host $host;
    }

    location /health/live {
      set $upstream_host backend;
      proxy_pass http://$upstream_host:4000/health/live;
      proxy_set_header Host $host;
    }

    location /admin/ {
      set $upstream_host admin-panel;
      proxy_pass http://$upstream_host:3001/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      set $upstream_host frontend;
      proxy_pass http://$upstream_host:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
