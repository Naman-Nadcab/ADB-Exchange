# Loaded only when nginx/ssl/wallet-browser/ exists.
# Wallet in-app browsers reject the IP certificate, so they open this hostname.
server {
  listen 443 ssl;
  http2 on;
  server_name 169.58.39.2.sslip.io;

  ssl_certificate     /etc/nginx/ssl/wallet-browser/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/wallet-browser/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security $hsts_header always;

  location = /api {
    set $upstream_host frontend;
    proxy_pass http://$upstream_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $upstream_host backend;
    proxy_pass http://$upstream_host:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /health {
    set $upstream_host backend;
    proxy_pass http://$upstream_host:4000/health;
    proxy_set_header Host $host;
  }

  location /health/live {
    set $upstream_host backend;
    proxy_pass http://$upstream_host:4000/health/live;
    proxy_set_header Host $host;
  }

  location /admin/ {
    set $upstream_host admin-panel;
    proxy_pass http://$upstream_host:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    set $upstream_host frontend;
    proxy_pass http://$upstream_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
